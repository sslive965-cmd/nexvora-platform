<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXVORA — Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#010302;color:#fff;font-family:Arial,sans-serif;padding:22px}.panel{max-width:1150px;margin:auto;padding:25px;background:#030906;border:1px solid #2cff7b66;box-shadow:0 0 40px #00ff641c}.logo{text-align:center;margin-bottom:25px}.logo b{display:block;color:#42ff8b;font-size:46px;text-shadow:0 0 20px #42ff8b}.logo strong{font-size:24px;letter-spacing:5px}.sub{color:#42ff8b;font-size:9px;letter-spacing:4px;margin-top:5px}.status{padding:13px;text-align:center;color:#42ff8b;border:1px solid #214b31;margin-bottom:20px;font-weight:bold}.content{display:none}h1,h2{color:#42ff8b;letter-spacing:1px}h1{font-size:24px;margin-bottom:6px}.info,.note{color:#83948a;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.card{background:#050b08;border:1px solid #42ff8b38;padding:18px}.stat label{display:block;color:#83948a;font-size:10px}.stat b{display:block;color:#42ff8b;font-size:23px;margin-top:6px}.card{margin-top:14px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.list{margin-top:12px}.row{border-top:1px solid #42ff8b22;padding:14px 0}.row:first-child{border-top:0}.title{color:#42ff8b;font-weight:bold}.text{color:#9aa9a0;font-size:13px;margin-top:5px;word-break:break-word}.muted{color:#66756c;font-size:11px;margin-top:5px}.badge{display:inline-block;color:#42ff8b;border:1px solid #42ff8b55;padding:4px 7px;font-size:9px;margin-top:6px}.btn{padding:9px 13px;border:1px solid #42ff8b;background:transparent;color:#42ff8b;font-weight:bold;cursor:pointer}.btn:hover{background:#42ff8b;color:#001006}.danger{border-color:#ff6767;color:#ff6767}.danger:hover{background:#ff6767;color:#180000}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.toolbar{display:flex;gap:8px;margin-top:12px}.toolbar input,.field input,.field textarea,.field select{width:100%;background:#010302;color:#fff;border:1px solid #42ff8b40;padding:10px;outline:none}.field{margin-top:10px}.field label{display:block;color:#83948a;font-size:10px;margin-bottom:5px;letter-spacing:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field textarea{min-height:90px;resize:vertical}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:99;align-items:center;justify-content:center;padding:15px}.box{width:min(700px,100%);max-height:92vh;overflow:auto;background:#050b08;border:1px solid #42ff8b;padding:20px}.box h2{margin-bottom:10px}.empty{color:#83948a;padding:10px 0}.error{color:#ff7777;padding:10px 0}.thumb{width:70px;height:55px;object-fit:cover;margin-top:7px;border:1px solid #42ff8b55}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:500px){body{padding:10px}.panel{padding:15px}.stats{grid-template-columns:1fr}}
</style></head><body>
<div class="panel"><div class="logo"><b>N</b><strong>NEXVORA</strong><div class="sub">ADMIN CONTROL</div></div><div class="status" id="status">VERIFYING ADMIN ACCESS...</div>
<div class="content" id="content"><h1>ADMIN PANEL</h1><p class="info">Full administrator control center.</p>
<div class="stats"><div class="stat"><label>CUSTOMERS</label><b id="usersCount">—</b></div><div class="stat"><label>ORDERS</label><b id="ordersCount">—</b></div><div class="stat"><label>PAYMENTS</label><b id="paymentsCount">—</b></div><div class="stat"><label>PRODUCTS</label><b id="productsCount">—</b></div></div>
<div class="card"><h2>ADMIN ACCESS</h2><p class="text" id="adminEmail">Loading...</p><span class="badge">ADMIN VERIFIED</span></div>
<div class="card"><div class="head"><h2>CUSTOMERS</h2><button class="btn" onclick="loadUsers()">REFRESH</button></div><div class="toolbar"><input id="userSearch" placeholder="SEARCH USERNAME OR EMAIL"></div><div class="list" id="users">Loading...</div></div>
<div class="card"><div class="head"><h2>PAYMENTS</h2><button class="btn" onclick="loadPayments()">REFRESH</button></div><div class="list" id="payments">Loading...</div></div>
<div class="card"><div class="head"><h2>PRODUCTS</h2><button class="btn" onclick="productModal()">+ ADD PRODUCT</button></div><div class="list" id="products">Loading...</div></div>
<div class="card"><div class="head"><h2>ORDERS</h2><button class="btn" onclick="orderModal()">+ PLACE ORDER</button></div><div class="list" id="orders">Loading...</div></div>
<div class="card"><div class="head"><h2>DELIVERIES</h2><button class="btn" onclick="loadDeliveries()">REFRESH</button></div><div class="list" id="deliveries">Loading...</div></div>
<div class="card"><button class="btn danger" onclick="logout()">LOGOUT</button></div>
</div></div>
<div class="modal" id="modal"><div class="box"><h2 id="mtitle"></h2><div id="mbody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const {createClient}=supabase;const db=createClient("https://lkspavoccfcwgufmczzq.supabase.co","sb_publishable_Dcahy9-eTRD5qe_5wz1z8A_hhQEn_1T");let users=[],products=[],orders=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');function modal(t,b){$('mtitle').textContent=t;$('mbody').innerHTML=b;$('modal').style.display='flex'}function closeM(){$('modal').style.display='none'}$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
async function loadUsers(){let r=await db.from('profiles').select('user_id,username,email,role,balance').order('username');if(r.error){$('users').innerHTML='<div class=error>'+esc(r.error.message)+'</div>';return}users=r.data||[];$('usersCount').textContent=users.length;renderUsers()}function renderUsers(){let q=($('userSearch').value||'').toLowerCase();let a=users.filter(u=>(u.username||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q));$('users').innerHTML=a.length?a.map(u=>`<div class=row><div class=title>${esc(u.username)}</div><div class=text>${esc(u.email)}</div><div class=text>BALANCE: ₹${Number(u.balance||0).toFixed(2)}</div><span class=badge>${esc(u.role||'customer')}</span><div class=actions><button class=btn onclick="balance('${u.user_id}')">BALANCE + / −</button><button class=btn onclick="history('${u.user_id}','${esc(u.username)}')">HISTORY</button>${u.role!=='admin'?`<button class="btn danger" onclick="delUser('${u.user_id}','${esc(u.username)}')">DELETE ACCOUNT</button>`:''}</div></div>`).join(''):'<div class=empty>No customers found.</div>'}$('userSearch').oninput=renderUsers;
function balance(id){let u=users.find(x=>x.user_id===id);modal('ADJUST BALANCE',`<p class=text>Current: ₹${Number(u.balance||0).toFixed(2)}</p><div class=field><label>AMOUNT (+ CREDIT / − DEBIT)</label><input id=amt type=number step=.01></div><div class=field><label>REASON</label><input id=reason placeholder="Admin adjustment"></div><div class=actions><button class=btn onclick="applyBal('${id}')">APPLY</button><button class=btn onclick=closeM()>CANCEL</button></div>`)}async function applyBal(id){let n=Number($('amt').value);if(!n){alert('Enter a non-zero amount');return}let r=await db.rpc('admin_adjust_balance',{target_user_id:id,adjustment_amount:n,adjustment_reason:$('reason').value||'Admin adjustment'});if(r.error){alert(r.error.message);return}closeM();loadUsers()}async function history(id,name){modal('BALANCE HISTORY — '+name,'Loading...');let r=await db.from('balance_transactions').select('amount,balance_before,balance_after,type,reason,created_at').eq('user_id',id).order('created_at',{ascending:false});$('mbody').innerHTML=r.error?'<div class=error>'+esc(r.error.message)+'</div>':(r.data?.map(x=>`<div class=row><div class=title>${esc(x.type)}</div><div class=text>₹${esc(x.amount)} → ₹${esc(x.balance_after)}</div><div class=text>${esc(x.reason||'')}</div><div class=muted>${esc(x.created_at)}</div></div>`).join('')||'<div class=empty>No history.</div>')}async function delUser(id,name){if(!confirm('Delete customer account '+name+'?'))return;let r=await db.rpc('admin_delete_customer',{target_user_id:id});if(r.error){alert(r.error.message);return}loadUsers()}
async function loadPayments(){let r=await db.from('payment_submissions').select('id,created_at,username,amount,utr,status,screenshot_url').order('created_at',{ascending:false});if(r.error){$('payments').innerHTML='<div class=error>'+esc(r.error.message)+'</div>';return}$('paymentsCount').textContent=r.data?.length||0;$('payments').innerHTML=r.data?.length?r.data.map(p=>`<div class=row><div class=title>PAYMENT #${p.id}</div><div class=text>USER: ${esc(p.username)} | AMOUNT: ₹${esc(p.amount)} | UTR: ${esc(p.utr)}</div><div class=text>STATUS: ${esc((p.status||'pending').toUpperCase())}</div>${p.screenshot_url?`<div class=text><a style="color:#42ff8b" target=_blank href="${esc(p.screenshot_url)}">VIEW SCREENSHOT</a></div>`:''}${String(p.status||'pending').toLowerCase()==='pending'?`<div class=actions><button class=btn onclick="approve(${p.id})">APPROVE + CREDIT</button><button class="btn danger" onclick="rejectPay(${p.id})">REJECT</button></div>`:''}</div>`).join(''):'<div class=empty>No payment submissions found.</div>'}async function approve(id){if(!confirm('Approve and credit this payment?'))return;let r=await db.rpc('admin_approve_payment',{payment_id:id});if(r.error)alert(r.error.message);else{loadPayments();loadUsers()}}async function rejectPay(id){if(!confirm('Reject this payment?'))return;let r=await db.rpc('admin_reject_payment',{payment_id:id});if(r.error)alert(r.error.message);else loadPayments()}
function maskCardInput(el){const d=String(el.value||'').replace(/\D/g,'').slice(-4);el.value=d?'•••• •••• •••• '+d:'';}
function unmaskCardInput(el){const d=String(el.value||'').replace(/\D/g,'').slice(-4);el.value=d;}
function productModal(p={}){
 const c=p.custom_fields||{};
 const cf=(k)=>esc(c[k]??'');
 modal(p.id?'EDIT PRODUCT':'ADD PRODUCT',`<div class=field><label>CARD / PRODUCT NAME</label><input id=pn value="${esc(p.name??'')}"></div><div class=grid><div class=field><label>PRICE</label><input id=pp type=number step=.01 value="${esc(p.price??'')}"></div><div class=field><label>CATEGORY</label><select id=pc><option value="DIGITAL PRODUCTS" ${String(p.category??'').trim().toUpperCase()==='DIGITAL PRODUCTS'?'selected':''}>DIGITAL PRODUCTS</option><option value="GIFT CARDS" ${String(p.category??'').trim().toUpperCase()==='GIFT CARDS'?'selected':''}>GIFT CARDS</option><option value="SOFTWARE LICENSES" ${String(p.category??'').trim().toUpperCase()==='SOFTWARE LICENSES'?'selected':''}>SOFTWARE LICENSES</option><option value="DIGITAL ACCESS" ${String(p.category??'').trim().toUpperCase()==='DIGITAL ACCESS'?'selected':''}>DIGITAL ACCESS</option></select></div><div class=field><label>BRAND</label><input id=pb value="${esc(p.brand??'')}"></div><div class=field><label>CARD NETWORK</label><input id=cn value="${cf('card_network')}"></div></div><div class=grid><div class=field><label>CARD NUMBER / DISPLAY NUMBER (LAST 4 DIGITS)</label><input id=cc inputmode="numeric" maxlength="19" pattern="[0-9]{4}" placeholder="1234" value="${String(c.card_number??'').replace(/\D/g,'').slice(-4) ? '•••• •••• •••• '+String(c.card_number??'').replace(/\D/g,'').slice(-4) : ''}" oninput="this.value=this.value.replace(/\D/g,'').slice(-4)" onblur="maskCardInput(this)" onfocus="unmaskCardInput(this)"><div id=ccPreview style="margin-top:6px;font-size:13px;opacity:.85">•••• •••• •••• ${String(c.card_number??'').replace(/\D/g,'').slice(-4) || '----'}</div></div><div class=field><label>CARD HOLDER</label><input id=ch value="${cf('card_holder')}"></div><div class=field><label>CARD TYPE</label><input id=ct value="${cf('card_type')}"></div><div class=field><label>EXPIRY</label><input id=ce value="${cf('expiry')}"></div></div><div class=grid><div class=field><label>CARD BALANCE</label><input id=cb type=number step=.01 value="${cf('card_balance')}"></div><div class=field><label>LIMIT</label><input id=cl type=number step=.01 value="${cf('limit')}"></div><div class=field><label>ENTRY FEE</label><input id=cfee type=number step=.01 value="${cf('entry_fee')}"></div><div class=field><label>QUANTITY</label><input id=cq type=number step=1 min=0 value="${cf('quantity')}"></div></div><div class=grid><div class=field><label>DELIVERY</label><input id=cd value="${cf('delivery')}"></div><div class=field><label>DISPLAY STATUS</label><input id=cs value="${cf('display_status')}"></div></div><div class=field><label>DESCRIPTION</label><textarea id=pd>${esc(p.description??'')}</textarea></div><div class=field><label>IMAGE (OPTIONAL)</label><input id=pi type=file accept=image/*></div><div class=field><label>OTHER CUSTOM FIELDS JSON (OPTIONAL)</label><textarea id=px>${esc(JSON.stringify(c,null,2))}</textarea></div><div class=field><label>ACTIVE</label><select id=pa><option value=true ${p.is_active!==false?'selected':''}>YES</option><option value=false ${p.is_active===false?'selected':''}>NO</option></select></div><div class=actions><button class=btn onclick="saveProduct(${p.id?`'${p.id}'`:'null'})">SAVE</button><button class=btn onclick=closeM()>CANCEL</button></div>`)
}
async function loadProducts(){let r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){$('products').innerHTML='<div class=error>'+esc(r.error.message)+'</div>';return}products=r.data||[];$('productsCount').textContent=products.length;$('products').innerHTML=products.length?products.map(p=>{const c=p.custom_fields||{};return `<div class=row><div class=title>${esc(p.name||'UNNAMED PRODUCT')}</div><div class=text>${esc(c.card_network||'')} ${c.card_number?'| '+esc(c.card_number):''} ${p.price!=null?'| ₹'+Number(p.price||0).toFixed(2):''}</div><div class=text>${esc(p.category||'')} ${p.brand?'| '+esc(p.brand):''}</div><div class=text>${esc(p.description||'')}</div>${p.image_url?`<img class=thumb src="${esc(p.image_url)}">`:''}<div class=actions><button class=btn onclick="productModal(products.find(x=>String(x.id)===String('${p.id}')))">EDIT</button><button class="btn danger" onclick="delProduct('${p.id}')">DELETE</button></div></div>`}).join(''):'<div class=empty>No products found.</div>'}
async function saveProduct(id){let custom={};try{custom=JSON.parse($('px').value||'{}');if(!custom||typeof custom!=='object'||Array.isArray(custom))throw new Error()}catch(e){alert('Invalid custom JSON');return}Object.assign(custom,{card_network:$('cn').value.trim(),card_number:(($('cc').dataset.last4||$('cc').value.replace(/\D/g,'').slice(-4)).padStart(4,'0')).replace(/^(\d{4})$/,'•••• •••• •••• $1'),card_holder:$('ch').value.trim(),card_type:$('ct').value.trim(),card_balance:$('cb').value===''?'':Number($('cb').value),limit:$('cl').value===''?'':Number($('cl').value),expiry:$('ce').value.trim(),delivery:$('cd').value.trim(),entry_fee:$('cfee').value===''?'':Number($('cfee').value),quantity:$('cq').value===''?'':Number($('cq').value),display_status:$('cs').value.trim()});let image=id?(products.find(x=>String(x.id)===String(id))||{}).image_url:null,file=$('pi').files[0];if(file){let path=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await db.storage.from('product-images').upload(path,file);if(u.error){alert(u.error.message);return}image=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}let rawPrice=$('pp').value.trim();let p={name:$('pn').value.trim()||null,price:rawPrice===''?null:Number(rawPrice),category:$('pc').value.trim()||null,brand:$('pb').value.trim()||null,description:$('pd').value.trim()||null,image_url:image,is_active:$('pa').value==='true',custom_fields:custom,updated_at:new Date().toISOString()};let r=id?await db.from('products').update(p).eq('id',id):await db.from('products').insert(p);if(r.error)alert(r.error.message);else{closeM();loadProducts()}}
async function delProduct(id){if(!confirm('Delete product?'))return;let r=await db.from('products').delete().eq('id',id);if(r.error)alert(r.error.message);else loadProducts()}
function orderModal(o={}){let us=users.filter(x=>x.role!=='admin').map(u=>`<option value="${u.user_id}" ${o.user_id===u.user_id?'selected':''}>${esc(u.username)} — ${esc(u.email)}</option>`).join(''),ps=products.map(p=>`<option value="${p.id}" ${o.product_id===p.id?'selected':''}>${esc(p.name)} — ₹${p.price}</option>`).join('');modal(o.id?'EDIT ORDER':'PLACE ORDER',`<div class=field><label>CUSTOMER</label><select id=ou><option value="">Select customer</option>${us}</select></div><div class=field><label>PRODUCT</label><select id=op><option value="">Manual</option>${ps}</select></div><div class=grid><div class=field><label>PRODUCT NAME</label><input id=on value="${esc(o.product_name||'')}"></div><div class=field><label>AMOUNT</label><input id=oa type=number step=.01 value="${esc(o.amount??'')}"></div></div><div class=field><label>STATUS</label><select id=os>${['pending','verified','processing','delivered','cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class=field><label>CUSTOMER NOTE</label><textarea id=onote>${esc(o.customer_note||'')}</textarea></div><div class=field><label>CUSTOM FIELDS JSON</label><textarea id=oc>${esc(JSON.stringify(o.custom_fields||{},null,2))}</textarea></div><div class=actions><button class=btn onclick="saveOrder(${o.id||'null'})">SAVE ORDER</button><button class=btn onclick=closeM()>CANCEL</button></div>`)}async function loadOrders(){let r=await db.from('orders').select('id,user_id,product_id,product_name,amount,status,customer_note,custom_fields,created_at').order('created_at',{ascending:false});if(r.error){$('orders').innerHTML='<div class=error>'+esc(r.error.message)+'</div>';return}orders=r.data||[];$('ordersCount').textContent=orders.length;$('orders').innerHTML=orders.length?orders.map(o=>`<div class=row><div class=title>ORDER #${o.id}</div><div class=text>${esc(o.product_name||'N/A')} | ₹${esc(o.amount)} | ${esc((o.status||'pending').toUpperCase())}</div><div class=muted>USER: ${esc(o.user_id||'N/A')} | ${esc(o.created_at)}</div><div class=actions><button class=btn onclick="orderModal(orders.find(x=>x.id===${o.id}))">EDIT / VERIFY</button><button class=btn onclick="deliveryModal(${o.id})">DELIVERY</button><button class="btn danger" onclick="delOrder(${o.id})">DELETE</button></div></div>`).join(''):'<div class=empty>No orders found.</div>'}async function saveOrder(id){let custom;try{custom=JSON.parse($('oc').value||'{}')}catch(e){alert('Invalid custom JSON');return}let rdata={user_id:$('ou').value,product_id:$('op').value?Number($('op').value):null,product_name:$('on').value.trim()||null,amount:Number($('oa').value||0),status:$('os').value,customer_note:$('onote').value.trim()||null,custom_fields:custom,updated_at:new Date().toISOString()};if(!rdata.user_id){alert('Select customer');return}let r=id?await db.from('orders').update(rdata).eq('id',id):await db.from('orders').insert(rdata);if(r.error)alert(r.error.message);else{closeM();loadOrders()}}async function delOrder(id){if(!confirm('Delete order?'))return;let r=await db.from('orders').delete().eq('id',id);if(r.error)alert(r.error.message);else loadOrders()}
async function deliveryModal(orderId){let r=await db.from('order_deliveries').select('*').eq('order_id',orderId).maybeSingle(),d=r.data||{};modal('DELIVERY — ORDER #'+orderId,`<div class=field><label>STATUS</label><select id=ds>${['pending','processing','delivered','cancelled'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class=field><label>TITLE</label><input id=dt value="${esc(d.title||'')}"></div><div class=field><label>MESSAGE / CONTENT</label><textarea id=dm>${esc(d.message||'')}</textarea></div><div class=field><label>IMAGES</label><input id=di type=file accept=image/* multiple></div><div class=field><label>CUSTOM DELIVERY FIELDS JSON</label><textarea id=dx>${esc(JSON.stringify(d.custom_fields||{},null,2))}</textarea></div><p class=note>Custom fields can contain any JSON data you want to deliver.</p><div class=actions><button class=btn onclick="saveDelivery(${orderId},${d.id||'null'})">SAVE DELIVERY</button><button class=btn onclick=closeM()>CANCEL</button></div>`)}async function loadDeliveries(){let r=await db.from('order_deliveries').select('id,order_id,status,title,message,created_at').order('created_at',{ascending:false});if(r.error){$('deliveries').innerHTML='<div class=error>'+esc(r.error.message)+'</div>';return}$('deliveries').innerHTML=r.data?.length?r.data.map(d=>`<div class=row><div class=title>DELIVERY #${d.id} — ORDER #${d.order_id}</div><div class=text>${esc((d.status||'pending').toUpperCase())} | ${esc(d.title||'')}</div><div class=actions><button class=btn onclick="deliveryModal(${d.order_id})">EDIT</button><button class="btn danger" onclick="delDelivery(${d.id})">DELETE</button></div></div>`).join(''):'<div class=empty>No deliveries found.</div>'}async function saveDelivery(orderId,id){let custom;try{custom=JSON.parse($('dx').value||'{}')}catch(e){alert('Invalid custom JSON');return}let images=id?(await db.from('order_deliveries').select('images').eq('id',id).maybeSingle()).data?.images||[]:[];for(const f of $('di').files){let path=Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await db.storage.from('product-images').upload(path,f);if(u.error){alert(u.error.message);return}images.push(db.storage.from('product-images').getPublicUrl(path).data.publicUrl)}let s=$('ds').value,p={order_id:orderId,status:s,title:$('dt').value.trim()||null,message:$('dm').value.trim()||null,images,custom_fields:custom,delivered_at:s==='delivered'?new Date().toISOString():null,updated_at:new Date().toISOString()};let r=id?await db.from('order_deliveries').update(p).eq('id',id):await db.from('order_deliveries').insert(p);if(r.error)alert(r.error.message);else{if(s==='delivered')await db.from('orders').update({status:'delivered',updated_at:new Date().toISOString()}).eq('id',orderId);closeM();loadDeliveries();loadOrders()}}async function delDelivery(id){if(!confirm('Delete delivery?'))return;let r=await db.from('order_deliveries').delete().eq('id',id);if(r.error)alert(r.error.message);else loadDeliveries()}
async function logout(){await db.auth.signOut();location.href='login.html'}async function start(){let u=await db.auth.getUser();if(!u.data.user){$('status').textContent='ACCESS DENIED';return location.href='login.html'}let p=await db.from('profiles').select('role,email').eq('user_id',u.data.user.id).single();if(p.error||p.data?.role!=='admin'){$('status').textContent='ACCESS DENIED';return setTimeout(()=>location.href='store.html',900)}$('status').textContent='ADMIN ACCESS VERIFIED';$('content').style.display='block';$('adminEmail').textContent=p.data.email;await Promise.all([loadUsers(),loadPayments(),loadProducts(),loadOrders(),loadDeliveries()])}start();
</script></body></html>
