<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXVORA — Enter Platform</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  overflow:hidden;
  background:#010302;
  color:#fff;
  font-family:'Rajdhani',sans-serif;
}

/* BACKGROUND GRID */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,255,100,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,100,.035) 1px,transparent 1px);
  background-size:55px 55px;
  transform:perspective(700px) rotateX(58deg) scale(1.8);
  transform-origin:center bottom;
  opacity:.7;
}

/* DARK VIGNETTE */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 70% 50%,
      rgba(0,255,100,.12),
      transparent 32%),
    radial-gradient(circle at 50% 50%,
      rgba(0,0,0,.1),
      #000 82%);
  pointer-events:none;
}

/* MOVING AURA */
.aura{
  position:fixed;
  width:650px;
  height:650px;
  right:5%;
  top:50%;
  transform:translateY(-50%);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(0,255,100,.22) 0%,
    rgba(0,255,100,.08) 32%,
    transparent 70%);
  filter:blur(18px);
  animation:auraPulse 5s ease-in-out infinite;
}

@keyframes auraPulse{
  0%,100%{
    transform:translateY(-50%) scale(.92);
    opacity:.65;
  }
  50%{
    transform:translateY(-50%) scale(1.12);
    opacity:1;
  }
}

/* ENERGY RINGS */
.ring{
  position:fixed;
  right:9%;
  top:50%;
  width:600px;
  height:180px;
  border:1px solid rgba(55,255,130,.25);
  border-radius:50%;
  transform:translateY(-50%) rotate(-18deg);
  box-shadow:0 0 30px rgba(55,255,130,.08);
  animation:ringMove 8s linear infinite;
}

.ring.two{
  width:500px;
  height:140px;
  animation-duration:6s;
  animation-direction:reverse;
  opacity:.55;
}

@keyframes ringMove{
  to{
    transform:translateY(-50%) rotate(342deg);
  }
}

/* CHARACTER-INSPIRED SILHOUETTE */
.character{
  position:fixed;
  right:14%;
  top:50%;
  width:300px;
  height:560px;
  transform:translateY(-50%);
  animation:characterFloat 6s ease-in-out infinite;
  filter:drop-shadow(0 0 25px rgba(45,255,120,.25));
}

@keyframes characterFloat{
  0%,100%{transform:translateY(-50%)}
  50%{transform:translateY(calc(-50% - 14px))}
}

.head{
  position:absolute;
  top:15px;
  left:98px;
  width:105px;
  height:125px;
  background:linear-gradient(145deg,#0a1510,#000);
  clip-path:polygon(28% 0,72% 0,100% 30%,88% 88%,55% 100%,18% 82%,0 40%);
  border:1px solid rgba(60,255,135,.35);
}

.hair{
  position:absolute;
  top:0;
  left:70px;
  width:160px;
  height:105px;
  background:#020403;
  clip-path:polygon(
    50% 0,65% 25%,88% 5%,82% 38%,
    100% 25%,84% 62%,63% 48%,
    45% 100%,39% 52%,12% 72%,
    18% 35%,0 50%,22% 8%
  );
  filter:drop-shadow(0 0 10px rgba(55,255,130,.18));
}

.eye{
  position:absolute;
  top:87px;
  left:166px;
  width:25px;
  height:4px;
  background:#42ff8b;
  box-shadow:0 0 18px #42ff8b;
  transform:rotate(-12deg);
}

.body{
  position:absolute;
  top:125px;
  left:42px;
  width:220px;
  height:390px;
  background:
    linear-gradient(145deg,#0a1510,#010201 55%,#07130c);
  clip-path:polygon(
    30% 0,70% 0,88% 15%,100% 55%,
    82% 100%,18% 100%,0 55%,12% 15%
  );
  border:1px solid rgba(55,255,130,.22);
}

.shoulder-aura{
  position:absolute;
  top:135px;
  left:5px;
  width:290px;
  height:210px;
  background:radial-gradient(ellipse,
    rgba(30,255,110,.12),
    transparent 70%);
  filter:blur(10px);
}

/* PARTICLES */
.particle{
  position:fixed;
  width:3px;
  height:3px;
  background:#42ff8b;
  border-radius:50%;
  box-shadow:0 0 12px #42ff8b;
  animation:particleMove 8s linear infinite;
  opacity:.6;
}

.p1{left:10%;bottom:10%}
.p2{left:24%;bottom:30%;animation-delay:2s}
.p3{left:48%;bottom:15%;animation-delay:4s}
.p4{right:25%;bottom:25%;animation-delay:1s}
.p5{right:8%;bottom:12%;animation-delay:3s}

@keyframes particleMove{
  from{
    transform:translateY(80px);
    opacity:0;
  }
  25%{opacity:.7}
  75%{opacity:.7}
  to{
    transform:translateY(-500px);
    opacity:0;
  }
}

/* NAVBAR */
.nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:80px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:10;
  border-bottom:1px solid rgba(55,255,130,.15);
  background:rgba(0,3,2,.6);
  backdrop-filter:blur(15px);
}

.logo{
  font-family:'Orbitron';
  font-weight:900;
  font-size:23px;
  letter-spacing:4px;
  color:#42ff8b;
  text-shadow:0 0 18px rgba(66,255,139,.5);
}

.logo span{
  color:#fff;
}

.status{
  color:#42ff8b;
  font-family:'Orbitron';
  font-size:9px;
  letter-spacing:2px;
}

.status::before{
  content:"●";
  margin-right:8px;
  text-shadow:0 0 10px #42ff8b;
}

/* MAIN */
.main{
  position:relative;
  z-index:5;
  min-height:100vh;
  display:flex;
  align-items:center;
  padding-left:9%;
  padding-top:50px;
}

.content{
  max-width:620px;
}

.system{
  color:#42ff8b;
  font-family:'Orbitron';
  font-size:11px;
  letter-spacing:3px;
  margin-bottom:25px;
}

h1{
  font-family:'Orbitron';
  font-size:clamp(55px,6vw,94px);
  line-height:.95;
  letter-spacing:-3px;
  text-transform:uppercase;
}

h1 span{
  color:#42ff8b;
  text-shadow:
    0 0 20px rgba(66,255,139,.35),
    0 0 55px rgba(66,255,139,.15);
}

.subtitle{
  margin-top:25px;
  max-width:500px;
  color:#91a198;
  font-size:18px;
  line-height:1.5;
}

.enter{
  display:inline-flex;
  align-items:center;
  gap:15px;
  margin-top:38px;
  padding:17px 34px;
  background:#42ff8b;
  color:#001006;
  text-decoration:none;
  font-family:'Orbitron';
  font-weight:800;
  font-size:11px;
  letter-spacing:2px;
  clip-path:polygon(
    12px 0,100% 0,calc(100% - 12px) 100%,0 100%
  );
  box-shadow:0 0 30px rgba(66,255,139,.3);
  transition:.3s;
}

.enter:hover{
  transform:translateY(-4px);
  box-shadow:0 0 50px rgba(66,255,139,.65);
}

.enter span{
  font-size:18px;
}

/* CORNER UI */
.corner{
  position:fixed;
  width:55px;
  height:55px;
  border-color:rgba(66,255,139,.4);
  z-index:6;
}

.c1{
  top:100px;
  left:30px;
  border-top:1px solid;
  border-left:1px solid;
}

.c2{
  bottom:30px;
  right:30px;
  border-right:1px solid;
  border-bottom:1px solid;
}

/* MOBILE */
@media(max-width:800px){

  body{
    overflow:auto;
  }

  .status{
    display:none;
  }

  .main{
    padding:120px 25px 50px;
    justify-content:center;
    text-align:center;
  }

  .content{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1{
    font-size:48px;
  }

  .subtitle{
    font-size:16px;
  }

  .character{
    right:-80px;
    opacity:.35;
    transform:translateY(-50%) scale(.75);
  }

  .aura{
    right:-150px;
  }

  .ring{
    right:-130px;
  }
}
</style>
</head>

<body>

<div class="aura"></div>
<div class="ring"></div>
<div class="ring two"></div>

<div class="shoulder-aura"></div>

<div class="character">
  <div class="hair"></div>
  <div class="head"></div>
  <div class="eye"></div>
  <div class="body"></div>
</div>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>

<div class="corner c1"></div>
<div class="corner c2"></div>

<header class="nav">
  <div class="logo">NEX<span>VORA</span></div>
  <div class="status">SYSTEM ONLINE</div>
</header>

<main class="main">

  <div class="content">

    <div class="system">
      // SECURE DIGITAL NETWORK
    </div>

    <h1>
      ENTER<br>
      THE <span>VOID</span>
    </h1>

    <p class="subtitle">
      Welcome to NEXVORA — a next-generation digital
      platform built around secure access, futuristic
      technology and a new way to experience digital products.
    </p>

    <a href="login.html" class="enter">
      ENTER PLATFORM
      <span>→</span>
    </a>

  </div>

</main>

</body>
</html>
