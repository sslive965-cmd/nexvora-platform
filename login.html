<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXVORA — Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:#010302;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* cyber background */
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,255,110,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,110,.025) 1px,transparent 1px),
    radial-gradient(circle at 50% 50%,rgba(0,255,100,.13),transparent 40%);
  background-size:50px 50px,50px 50px,100% 100%;
  z-index:-3;
}

.aura{
  position:fixed;
  width:600px;
  height:600px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(0,255,100,.18),
    rgba(0,255,100,.05) 35%,
    transparent 70%);
  filter:blur(15px);
  animation:aura 5s ease-in-out infinite;
  z-index:-2;
}

@keyframes aura{
  50%{transform:scale(1.15);opacity:.65}
}

/* subtle moving energy */
.energy{
  position:fixed;
  width:100%;
  height:2px;
  background:linear-gradient(90deg,
    transparent,#35ff82,transparent);
  box-shadow:0 0 20px #35ff82;
  opacity:.25;
  animation:scan 5s linear infinite;
  z-index:-1;
}

@keyframes scan{
  from{top:-10%}
  to{top:110%}
}

/* main */
.container{
  width:430px;
  padding:42px;
  background:rgba(3,9,6,.88);
  border:1px solid rgba(55,255,130,.45);
  box-shadow:
    0 0 45px rgba(0,255,100,.12),
    inset 0 0 35px rgba(0,255,100,.035);
  backdrop-filter:blur(18px);
}

.logo{
  text-align:center;
  margin-bottom:32px;
}

.logo-symbol{
  color:#42ff8b;
  font-size:46px;
  font-weight:900;
  text-shadow:0 0 25px #42ff8b;
}

.logo-name{
  margin-top:5px;
  color:#fff;
  font-size:25px;
  font-weight:800;
  letter-spacing:5px;
}

.logo-sub{
  color:#42ff8b;
  font-size:8px;
  letter-spacing:4px;
  margin-top:5px;
}

.tabs{
  display:flex;
  border-bottom:1px solid #173323;
  margin-bottom:28px;
}

.tab{
  width:50%;
  padding:14px;
  background:none;
  border:0;
  color:#68766e;
  cursor:pointer;
  font-weight:bold;
  letter-spacing:1px;
}

.tab.active{
  color:#42ff8b;
  border-bottom:2px solid #42ff8b;
  text-shadow:0 0 12px rgba(66,255,139,.6);
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  color:#9aa9a0;
  font-size:12px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:14px;
  background:#050b08;
  color:#fff;
  border:1px solid #1d3d29;
  outline:none;
  transition:.25s;
}

input:focus{
  border-color:#42ff8b;
  box-shadow:0 0 15px rgba(66,255,139,.12);
}

.action{
  width:100%;
  margin-top:8px;
  padding:15px;
  border:0;
  background:#42ff8b;
  color:#001006;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 25px rgba(66,255,139,.25);
  transition:.25s;
}

.action:hover{
  box-shadow:0 0 40px rgba(66,255,139,.55);
  transform:translateY(-2px);
}

.switch{
  text-align:center;
  margin-top:22px;
  color:#718078;
  font-size:12px;
}

.switch span{
  color:#42ff8b;
  cursor:pointer;
}

.back{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#647169;
  text-decoration:none;
  font-size:11px;
}

.back:hover{color:#42ff8b}

.hidden{display:none}

@media(max-width:520px){
  .container{
    width:92%;
    padding:30px 24px;
  }
}
</style>
</head>

<body>

<div class="aura"></div>
<div class="energy"></div>

<div class="container">

  <div class="logo">
    <div class="logo-symbol">N</div>
    <div class="logo-name">NEXVORA</div>
    <div class="logo-sub">DIGITAL ACCESS</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="loginTab">LOGIN</button>
    <button class="tab" id="registerTab">REGISTER</button>
  </div>

  <!-- LOGIN -->
  <form id="loginForm">

    <div class="form-group">
      <label>USERNAME OR EMAIL</label>
      <input type="text" id="loginUser" placeholder="Enter username or email" required>
    </div>

    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" id="loginPassword" placeholder="Enter password" required>
    </div>

    <button class="action" type="submit">
      LOGIN →
    </button>

    <div class="switch">
      Don't have an account?
      <span id="toRegister">Register</span>
    </div>

  </form>

  <!-- REGISTER -->
  <form id="registerForm" class="hidden">

    <div class="form-group">
      <label>USERNAME</label>
      <input type="text" id="regUsername" placeholder="Choose username" required>
    </div>

    <div class="form-group">
      <label>EMAIL</label>
      <input type="email" id="regEmail" placeholder="Enter email" required>
    </div>

    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" id="regPassword" placeholder="Create password" required>
    </div>

    <button class="action" type="submit">
      CREATE ACCOUNT →
    </button>

    <div class="switch">
      Already have an account?
      <span id="toLogin">Login</span>
    </div>

  </form>

  <a href="index.html" class="back">← BACK TO NEXVORA</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://lkspavoccfcwgufmczzq.supabase.co";
const SUPABASE_KEY = "sb_publishable_Dcahy9-eTRD5qe_5wz1z8A_hhQEn_1T";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

function showRegister(){
  loginForm.classList.add("hidden");
  registerForm.classList.remove("hidden");
  loginTab.classList.remove("active");
  registerTab.classList.add("active");
}

function showLogin(){
  registerForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
  registerTab.classList.remove("active");
  loginTab.classList.add("active");
}

registerTab.onclick = showRegister;
loginTab.onclick = showLogin;

document.getElementById("toRegister").onclick = showRegister;
document.getElementById("toLogin").onclick = showLogin;


/* REGISTER */
registerForm.addEventListener("submit", async function(e){
  e.preventDefault();

  const username = document.getElementById("registerUsername").value.trim();
  const email = document.getElementById("registerEmail").value.trim();
  const password = document.getElementById("registerPassword").value;

  if(!username || !email || !password){
    alert("Please fill all fields.");
    return;
  }

  const { data, error } = await db.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        username: username
      }
    }
  });

  if(error){
    alert(error.message);
    return;
  }

  alert("Registration successful. You can now login.");
  showLogin();
});


/* LOGIN */
loginForm.addEventListener("submit", async function(e){
  e.preventDefault();

  const identifier = document.getElementById("loginIdentifier").value.trim();
  const password = document.getElementById("loginPassword").value;

  if(!identifier || !password){
    alert("Please enter your login details.");
    return;
  }

  /* Current connection uses email login.
     Username login will be connected after the profile table is created. */

  const { data, error } = await db.auth.signInWithPassword({
    email: identifier,
    password: password
  });

  if(error){
    alert(error.message);
    return;
  }

  window.location.href = "store.html";
});
</script>

</body>
</html>
