<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEXVORA — Customer Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030504;color:#eaffea;font-family:Rajdhani,Arial,sans-serif}nav{height:68px;border-bottom:1px solid #42ff8b25;background:#010302ee;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.logo{font-family:Orbitron;color:#42ff8b;font-weight:800;letter-spacing:3px}.nav-actions{display:flex;gap:8px}.btn{border:1px solid #42ff8b35;background:#030806;color:#c8d7cc;padding:9px 12px;border-radius:6px;text-decoration:none;font-family:Orbitron;font-size:9px;cursor:pointer}.btn:hover{border-color:#42ff8b;color:#42ff8b}.container{width:min(1050px,92%);margin:38px auto 60px}.head small{font-family:Orbitron;color:#42ff8b;letter-spacing:2px;font-size:10px}.head h1{font-family:Orbitron;margin:7px 0;font-size:30px}.head p{color:#718077}.balance{margin:24px 0;border:1px solid #42ff8b30;background:linear-gradient(135deg,#07120c,#020604);padding:22px;border-radius:10px}.balance label{display:block;color:#718077;font-family:Orbitron;font-size:10px;letter-spacing:2px}.balance strong{display:block;color:#42ff8b;font-family:Orbitron;font-size:32px;margin:8px 0}.panel{border:1px solid #42ff8b25;background:#030806;padding:20px;border-radius:10px;margin-bottom:18px}.panel h2{font-family:Orbitron;font-size:13px;color:#42ff8b}.profile-row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #ffffff0c}.profile-row:last-child{border-bottom:0}.muted{color:#718077}.update{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}.update input{flex:1;min-width:220px;background:#020604;border:1px solid #42ff8b30;color:#fff;padding:11px;border-radius:6px}.save{border:1px solid #42ff8b;background:#42ff8b;color:#020502;padding:11px 16px;border-radius:6px;font-family:Orbitron;font-weight:700;cursor:pointer}.orders{display:grid;gap:10px}.order{border:1px solid #42ff8b1f;background:#020604;padding:14px;border-radius:7px}.order strong{font-family:Orbitron;color:#42ff8b;font-size:11px}.order .status{float:right;color:#42ff8b;font-size:11px}.empty,.error{color:#718077;padding:10px}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.danger{border-color:#ff777755;color:#ff9999}@media(max-width:600px){.container{width:92%}.head h1{font-size:24px}.profile-row{display:block}.profile-row span{display:block;margin:4px 0}}
</style></head><body><nav><div class="logo">NEXVORA</div><div class="nav-actions"><a class="btn" href="home.html">⌂ HOME</a><button id="logoutBtn" class="btn danger">⇥ LOGOUT</button></div></nav><main class="container"><section class="head"><small>CUSTOMER CONTROL CENTER</small><h1>WELCOME, <span id="welcomeUser">CUSTOMER</span></h1><p>Your customer dashboard contains only your account, username and orders.</p></section><section class="balance"><label>AVAILABLE BALANCE</label><strong id="balance">₹0.00</strong></section><section class="panel"><h2>USERNAME</h2><div class="profile-row"><span class="muted">CURRENT USERNAME</span><span id="profileUser">Loading...</span></div><div class="update"><input id="usernameInput" placeholder="Enter new username" maxlength="50"><button id="saveUsername" class="save">SAVE USERNAME</button></div></section><section class="panel"><h2>ORDER HISTORY</h2><div id="orders" class="orders"><div class="empty">Loading orders...</div></div></section><div class="footer-actions"><a class="btn" href="home.html">⌂ BACK TO HOME</a><button id="logoutBtn2" class="btn danger">⇥ LOGOUT</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://lkspavoccfcwgufmczzq.supabase.co','sb_publishable_Dcahy9-eTRD5qe_5wz1z8A_hhQEn_1T');let user=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function money(v){return '₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
async function load(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}user=session.user;const {data:p,error}=await db.from('profiles').select('username,email,balance,role').eq('user_id',user.id).maybeSingle();if(error){alert(error.message);return}const name=p?.username||user.user_metadata?.username||user.email?.split('@')[0]||'Customer';$('welcomeUser').textContent=name;$('profileUser').textContent=name;$('usernameInput').value=name;$('balance').textContent=money(p?.balance);await loadOrders()}
async function loadOrders(){const r=await db.from('orders').select('id,product_name,amount,status,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(r.error){$('orders').innerHTML='<div class=error>'+esc(r.error.message)+'</div>';return}const rows=r.data||[];$('orders').innerHTML=rows.length?rows.map(o=>`<div class=order><span class=status>${esc(String(o.status||'pending').toUpperCase())}</span><strong>ORDER #${esc(o.id)}</strong><div>${esc(o.product_name||'NEXVORA PRODUCT')} — ${money(o.amount)}</div><div class="muted">${new Date(o.created_at).toLocaleString('en-IN')}</div></div>`).join(''):'<div class=empty>No orders yet.</div>'}
async function saveName(){const name=$('usernameInput').value.trim();if(name.length<3){alert('Username must be at least 3 characters.');return}const r=await db.from('profiles').update({username:name}).eq('user_id',user.id);if(r.error){alert('Username update failed: '+r.error.message);return}$('profileUser').textContent=name;$('welcomeUser').textContent=name;alert('Username updated successfully.')}
async function logout(){await db.auth.signOut();location.href='index.html'}$('saveUsername').onclick=saveName;$('logoutBtn').onclick=logout;$('logoutBtn2').onclick=logout;load();
</script></body></html>
