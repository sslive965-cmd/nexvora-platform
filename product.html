<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXVORA — Product Details</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#010302;color:#f4fff9;font-family:Rajdhani,Arial,sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-5;background:linear-gradient(rgba(0,255,100,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,100,.035) 1px,transparent 1px);background-size:55px 55px;transform:perspective(700px) rotateX(58deg) scale(1.8);transform-origin:center bottom}body:after{content:"";position:fixed;inset:0;z-index:-4;background:radial-gradient(circle at 65% 35%,rgba(0,255,100,.14),transparent 30%),linear-gradient(180deg,#000,#020604 55%,#000)}
.navbar{height:78px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:rgba(0,3,2,.88);backdrop-filter:blur(18px);border-bottom:1px solid #42ff8b2e}.logo{display:flex;align-items:center;gap:10px}.logo-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #42ff8b;color:#42ff8b;font:800 25px Orbitron;clip-path:polygon(25% 0,100% 0,75% 100%,0 100%);text-shadow:0 0 14px #42ff8b}.logo-name{font:800 20px Orbitron;letter-spacing:3px}.logo-sub{font-size:8px;letter-spacing:3px;color:#42ff8b}.back{color:#b9c8c0;text-decoration:none;border:1px solid #42ff8b55;padding:10px 15px;font:9px Orbitron}.back:hover{color:#42ff8b;border-color:#42ff8b}
.container{width:min(1200px,92%);margin:auto;padding:50px 0 90px}.system{color:#42ff8b;font:10px Orbitron;letter-spacing:2px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#42ff8b;box-shadow:0 0 14px #42ff8b;margin-right:8px}.layout{margin-top:38px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.visual{min-height:510px;display:flex;align-items:center;justify-content:center;position:relative}.aura{position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,#42ff8b33,transparent 68%);filter:blur(16px)}
.scene{width:min(460px,94%);height:285px;perspective:1200px;cursor:pointer;position:relative}.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.7,.2,1)}.scene.flipped .flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid #42ff8b;border-radius:20px;background:linear-gradient(145deg,#08150d,#010201);box-shadow:0 0 35px #42ff8b33,inset 0 0 30px #42ff8b0f;padding:28px;overflow:hidden}.front{background-size:cover;background-position:center}.front:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#010302d9,#06140bd0);pointer-events:none}.front>*{position:relative;z-index:1}.brand{font:800 18px Orbitron;color:#42ff8b;letter-spacing:3px}.network{color:#dffff0;font:10px Orbitron}.front-top,.back-top{display:flex;justify-content:space-between;align-items:center}.chip{width:48px;height:36px;margin-top:52px;border:1px solid #9dffbd;border-radius:7px;background:linear-gradient(135deg,#183b27,#79ff9e)}.number{margin-top:23px;font:16px Orbitron;letter-spacing:4px}.card-bottom{margin-top:27px;display:flex;justify-content:space-between;color:#b2c2ba;font:9px Orbitron}.back-face{transform:rotateY(180deg)}.mag{height:48px;background:#020302;margin:25px -28px 22px;border-top:1px solid #42ff8b22;border-bottom:1px solid #42ff8b22}.back-content{color:#a8b8b0;font-size:13px;line-height:1.8}.back-content b{color:#fff}.hint{text-align:center;margin-top:13px;color:#718078;font:9px Orbitron;letter-spacing:1px}.flip-note{position:absolute;bottom:-35px;left:0;right:0;text-align:center;color:#42ff8b;font:8px Orbitron;opacity:.8}
.info h1{font:800 clamp(34px,5vw,60px) Orbitron;line-height:1}.info h1 span{color:#42ff8b;text-shadow:0 0 22px #42ff8b55}.description{margin-top:20px;color:#84938c;line-height:1.6;font-size:16px}.price{margin-top:22px;color:#42ff8b;font:700 30px Orbitron}.status{display:inline-block;margin-top:11px;padding:7px 12px;border:1px solid #42ff8b55;color:#42ff8b;font:9px Orbitron;letter-spacing:1px}.features{margin-top:25px;display:grid;gap:8px;color:#a5b3ac;font-size:14px}.features div:before{content:'✓';color:#42ff8b;margin-right:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.btn{padding:14px 18px;text-decoration:none;font:9px Orbitron;letter-spacing:.8px;text-align:center;cursor:pointer}.cart{color:#eafff1;border:1px solid #42ff8b;background:transparent}.buy{background:#42ff8b;color:#001006}.balance{background:#06150a;color:#42ff8b;border:1px solid #42ff8b}.btn:hover{box-shadow:0 0 24px #42ff8b2e;transform:translateY(-2px)}
@media(max-width:800px){.layout{grid-template-columns:1fr;gap:25px}.visual{min-height:380px}.digital-card{transform:none}.actions{flex-direction:column}.btn{width:100%}}@media(max-width:500px){.navbar{padding:0 12px}.logo-name{font-size:15px}.logo-mark{width:32px;height:32px;font-size:21px}.container{width:94%;padding-top:35px}.scene{height:235px}.face{padding:22px}.chip{margin-top:35px}.number{font-size:12px;letter-spacing:2px}}
</style></head>
<body>
<header class="navbar"><div class="logo"><div class="logo-mark">N</div><div><div class="logo-name">NEXVORA</div><div class="logo-sub">PRODUCT ACCESS</div></div></div><a href="store.html" class="back">← BACK TO STORE</a></header>
<main class="container"><div class="system"><span class="dot"></span>PRODUCT INFORMATION</div><section class="layout"><div class="visual"><div class="aura"></div><div class="scene" id="scene" title="Tap to flip"><div class="flip"><div class="face front" id="frontFace"><div class="front-top"><span class="brand" id="frontBrand">NEXVORA</span><span class="network" id="frontNetwork">CARD</span></div><div class="chip"></div><div class="number" id="frontNumber">•••• •••• ••••</div><div class="card-bottom"><span id="frontType">DIGITAL ACCESS</span><strong id="frontCategory">NEXVORA</strong></div></div><div class="face back-face"><div class="back-top"><span class="brand">CARD INFORMATION</span><span class="network" id="backNetwork">—</span></div><div class="mag"></div><div class="back-content" id="backContent">Loading...</div></div></div><div class="hint">TAP CARD TO FLIP</div></div></div><div class="info"><h1 id="productTitle">CARD<br><span>DETAILS</span></h1><p class="description" id="productDescription">Loading product information...</p><div class="price" id="productPrice">₹0</div><div class="status" id="productStatus">● LOADING</div><div class="features" id="productFeatures"></div><div class="actions"><a href="#" class="btn cart" id="addToCart">ADD TO CART</a><a href="#" class="btn buy" id="buyNow">BUY NOW →</a><a href="#" class="btn balance" id="buyBalance">BUY USING BALANCE</a></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const db=window.supabase.createClient('https://lkspavoccfcwgufmczzq.supabase.co','sb_publishable_Dcahy9-eTRD5qe_5wz1z8A_hhQEn_1T');const id=new URLSearchParams(location.search).get('id')||new URLSearchParams(location.search).get('product_id');const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');const money=v=>v===null||v===''||v===undefined||Number.isNaN(Number(v))?'—':'₹'+Number(v).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
$('scene').addEventListener('click',()=>$('scene').classList.toggle('flipped'));
function label(k){return String(k).replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase())}
function fields(c){const keys=['card_balance','limit','expiry','delivery','card_type','card_holder','card_network','card_number','quantity','game','topup_unit','package','denomination','region'];let out=[];for(const k of keys)if(c[k]!==undefined&&c[k]!==null&&String(c[k])!=='')out.push(`<div>${esc(label(k))}: <b>${esc(typeof c[k]==='object'?JSON.stringify(c[k]):c[k])}</b></div>`);for(const [k,v] of Object.entries(c))if(!keys.includes(k)&&!['entry_fee','display_status','brand'].includes(k)&&v!==''&&v!==null&&v!==undefined)out.push(`<div>${esc(label(k))}: <b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`);return out.join('')}
async function load(){if(!id){$('productStatus').textContent='● PRODUCT NOT SELECTED';return}const r=await db.from('products').select('id,name,description,price,image_url,category,brand,is_active,custom_fields').eq('id',id).maybeSingle();if(r.error||!r.data){$('productStatus').textContent='● PRODUCT NOT FOUND';return}const p=r.data,c=p.custom_fields&&typeof p.custom_fields==='object'?p.custom_fields:{};const category=p.category||'PRODUCT';const brand=p.brand||c.brand||'NEXVORA';document.title='NEXVORA — '+(p.name||'Product');$('productTitle').innerHTML=esc(p.name||'PRODUCT')+'<br><span>'+esc(category)+'</span>';$('productDescription').textContent=p.description||'';$('productPrice').textContent=money(p.price);$('productStatus').textContent=p.is_active?'● AVAILABLE':'● UNAVAILABLE';$('productFeatures').innerHTML=fields(c);$('backContent').innerHTML=`CATEGORY: <b>${esc(category)}</b><br>PRODUCT: <b>${esc(p.name||'—')}</b><br>PRICE: <b>${esc(money(p.price))}</b><br>BRAND: <b>${esc(brand)}</b><br>DELIVERY: <b>${esc(c.delivery||'After payment verification')}</b>`;$('frontBrand').textContent=brand;$('frontNetwork').textContent=c.card_network||category;$('backNetwork').textContent=c.card_network||'NEXVORA';$('frontNumber').textContent=c.card_number||'•••• •••• ••••';$('frontType').textContent=c.card_type||c.game||category;$('frontCategory').textContent=brand;if(p.image_url){$('frontFace').style.backgroundImage=`url("${String(p.image_url).replace(/"/g,'&quot;')}")`;}$('buyNow').onclick=e=>{e.preventDefault();location.href='payment.html?product_id='+encodeURIComponent(p.id)+'&amount='+encodeURIComponent(p.price)+'&mode=product'};$('buyBalance').onclick=e=>{e.preventDefault();location.href='payment.html?product_id='+encodeURIComponent(p.id)+'&amount='+encodeURIComponent(p.price)+'&mode=balance'};$('addToCart').onclick=e=>{e.preventDefault();let cart=[];try{cart=JSON.parse(localStorage.getItem('nexvora_cart')||'[]')}catch(_){}let x=cart.find(v=>String(v.id)===String(p.id));if(x)x.quantity=(Number(x.quantity)||1)+1;else cart.push({id:p.id,name:p.name||'',price:Number(p.price)||0,image_url:p.image_url||'',quantity:1});localStorage.setItem('nexvora_cart',JSON.stringify(cart));$('addToCart').textContent='ADDED TO CART ✓'};}
load();
</script></body></html>
