<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXVORA — Store</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{background:#010302;color:#f4fff9;font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden}

body::before{
  content:"";position:fixed;inset:0;z-index:-5;pointer-events:none;
  background:linear-gradient(rgba(0,255,100,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,255,100,.035) 1px,transparent 1px);
  background-size:55px 55px;transform:perspective(700px) rotateX(58deg) scale(1.8);
  transform-origin:center bottom;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-4;pointer-events:none;
  background:radial-gradient(circle at 50% 25%,rgba(0,255,100,.13),transparent 30%),
  linear-gradient(180deg,#000 0%,#020604 55%,#000 100%);
}
.aura{
  position:fixed;width:520px;height:520px;right:-120px;top:100px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,100,.20),rgba(0,255,100,.06) 38%,transparent 70%);
  filter:blur(15px);animation:pulseAura 5s ease-in-out infinite;pointer-events:none;z-index:-2;
}
@keyframes pulseAura{50%{transform:scale(1.18);opacity:.65}}

.navbar{
  height:78px;position:sticky;top:0;z-index:50;display:flex;align-items:center;
  justify-content:space-between;padding:0 5%;background:rgba(0,3,2,.82);
  backdrop-filter:blur(18px);border-bottom:1px solid rgba(50,255,130,.22);
}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{
  width:40px;height:40px;display:grid;place-items:center;color:#48ff8c;font-family:'Orbitron';
  font-size:27px;font-weight:900;border:1px solid #39ff88;
  clip-path:polygon(25% 0,100% 0,75% 100%,0 100%);text-shadow:0 0 15px #39ff88;
  box-shadow:0 0 18px rgba(57,255,136,.3)
}
.logo-name{font-family:'Orbitron';font-size:21px;font-weight:800;letter-spacing:3px}
.logo-sub{font-size:8px;letter-spacing:4px;color:#46ff91}
.nav-actions{display:flex;align-items:center;gap:12px}
.nav-btn,.balance{
  padding:10px 16px;border:1px solid rgba(61,255,136,.35);color:#b9c8c0;
  text-decoration:none;font-family:'Orbitron';font-size:9px;letter-spacing:1px;transition:.3s
}
.nav-btn:hover{color:#42ff8b;border-color:#42ff8b;box-shadow:0 0 18px rgba(61,255,136,.18)}
.balance{color:#42ff8b;border-color:#39ff88;box-shadow:0 0 15px rgba(57,255,136,.12)}

.cart-btn{
  position:relative;padding:10px 15px;border:1px solid #42ff8b;color:#42ff8b;
  background:rgba(66,255,139,.05);text-decoration:none;font-family:'Orbitron';
  font-size:9px;letter-spacing:1px;transition:.3s
}
.cart-btn:hover{background:rgba(66,255,139,.12);box-shadow:0 0 18px rgba(61,255,136,.18)}
.cart-count{
  display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;
  padding:0 5px;border-radius:20px;background:#42ff8b;color:#001006;font-size:8px;
  font-weight:900;vertical-align:middle
}
.product-actions button{
  flex:0 0 auto;min-width:105px;padding:11px 10px;text-align:center;
  font-family:'Orbitron';font-size:8px;letter-spacing:.7px;cursor:pointer
}
.add-cart{color:#42ff8b;border:1px solid rgba(61,255,136,.55);background:rgba(66,255,139,.04)}
.add-cart:hover{background:rgba(66,255,139,.12);box-shadow:0 0 15px rgba(61,255,136,.12)}
.add-cart.added{background:#42ff8b;color:#001006}
.toast{
  position:fixed;right:20px;bottom:20px;z-index:100;max-width:320px;padding:13px 16px;
  border:1px solid #42ff8b;background:rgba(0,10,5,.96);color:#dffff0;
  font-family:'Orbitron';font-size:9px;letter-spacing:.7px;box-shadow:0 0 25px rgba(61,255,136,.16);
  opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s
}
.toast.show{opacity:1;transform:translateY(0)}


.container{width:min(1400px,90%);margin:auto;padding:70px 0 100px}
.system{display:flex;align-items:center;gap:9px;color:#42ff8b;font-family:'Orbitron';font-size:10px;letter-spacing:2px}
.system-dot{width:7px;height:7px;border-radius:50%;background:#42ff8b;box-shadow:0 0 15px #42ff8b;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.25}}
h1{margin-top:16px;font-family:'Orbitron';font-size:clamp(38px,5vw,70px);line-height:1;letter-spacing:-2px}
h1 span{color:#42ff8b;text-shadow:0 0 25px rgba(61,255,136,.35)}
.subtitle{margin-top:15px;color:#77877f;letter-spacing:2px;font-size:14px}

/* CATEGORY HOME */
.category-panel{
  margin-top:48px;border:1px solid rgba(61,255,136,.22);
  background:rgba(0,3,2,.72);padding:24px;
}
.section-label{
  color:#8fa198;font-family:'Orbitron';font-size:9px;letter-spacing:1.5px;
  margin-bottom:18px;
}
.category-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
}
.category-btn{
  min-height:92px;padding:18px;border:1px solid rgba(61,255,136,.22);
  background:linear-gradient(145deg,rgba(5,18,11,.94),rgba(0,3,2,.98));
  color:#dffff0;font-family:'Orbitron';font-size:11px;letter-spacing:1px;
  cursor:pointer;text-align:left;transition:.25s;
}
.category-btn:hover,.category-btn.active{
  color:#42ff8b;border-color:#42ff8b;
  box-shadow:inset 0 0 25px rgba(61,255,136,.06),0 0 18px rgba(61,255,136,.10);
}
.category-btn small{
  display:block;margin-top:9px;color:#65766d;font-family:'Rajdhani';
  font-size:11px;letter-spacing:.5px;
}
.category-btn.active small{color:#8db39d}

.network-panel{
  margin-top:22px;
  border:1px solid rgba(61,255,136,.22);
  background:rgba(0,3,2,.72);
  padding:24px;
  display:none;
}
.network-panel.visible{display:block}
.network-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}
.network-btn{
  min-height:82px;
  padding:17px;
  border:1px solid rgba(61,255,136,.22);
  background:linear-gradient(145deg,rgba(5,18,11,.94),rgba(0,3,2,.98));
  color:#dffff0;
  font-family:'Orbitron';
  font-size:11px;
  letter-spacing:1px;
  cursor:pointer;
  text-align:left;
  transition:.25s;
}
.network-btn:hover,.network-btn.active{
  color:#42ff8b;
  border-color:#42ff8b;
  box-shadow:inset 0 0 25px rgba(61,255,136,.06),0 0 18px rgba(61,255,136,.10);
}
.network-btn small{
  display:block;
  margin-top:9px;
  color:#65766d;
  font-family:'Rajdhani';
  font-size:11px;
  letter-spacing:.5px;
}
.network-btn.active small{color:#8db39d}

.products-section{margin-top:45px;display:none}
.products-section.visible{display:block}
.products-toolbar{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
}
.current-category{font-family:'Orbitron';font-size:13px;color:#42ff8b;letter-spacing:1px}
.back-categories{
  border:1px solid rgba(61,255,136,.3);background:transparent;color:#9db0a5;
  padding:9px 13px;font-family:'Orbitron';font-size:8px;letter-spacing:1px;cursor:pointer;
}
.back-categories:hover{color:#42ff8b;border-color:#42ff8b}

/* PRODUCT LIST */
.product-grid{
  display:flex;flex-direction:column;gap:0;border:1px solid rgba(61,255,136,.22);
  background:rgba(0,3,2,.72);overflow:hidden;
}
.product{
  position:relative;padding:16px 20px;display:grid;
  grid-template-columns:minmax(300px,2fr) 150px 120px 250px;
  align-items:center;gap:20px;background:linear-gradient(145deg,rgba(5,18,11,.94),rgba(0,3,2,.98));
  border-bottom:1px solid rgba(61,255,136,.10);transition:.25s;
}
.product:last-child{border-bottom:0}
.product:hover{box-shadow:inset 0 0 28px rgba(61,255,136,.06)}
.product-media{display:flex;align-items:center;gap:18px;min-width:0}
.product-thumb{
  width:150px;height:86px;flex:0 0 150px;object-fit:cover;border:1px solid rgba(61,255,136,.65);
  border-radius:10px;background:#010201;box-shadow:0 0 18px rgba(61,255,136,.12)
}
.product-card{
  width:150px;height:86px;flex:0 0 150px;padding:10px 12px;border:1px solid #42ff8b;
  border-radius:10px;background:linear-gradient(145deg,#08150d,#010201);
  box-shadow:0 0 18px rgba(61,255,136,.12),inset 0 0 15px rgba(61,255,136,.05)
}
.card-brand{color:#42ff8b;font-family:'Orbitron';font-size:10px;letter-spacing:1.5px}
.chip{width:27px;height:19px;margin-top:12px;border:1px solid #9dffbd;border-radius:4px;background:linear-gradient(135deg,#183b27,#79ff9e)}
.card-number{margin-top:9px;font-family:'Orbitron';font-size:7px;letter-spacing:1px}
.card-type{margin-top:7px;display:flex;justify-content:space-between;font-family:'Orbitron';font-size:6px;color:#9db0a5}
.product-info{min-width:0}
.product h2{margin:0;font-family:'Orbitron';font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-desc{margin-top:5px;color:#718078;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-meta{color:#b8c8bf;font-family:'Orbitron';font-size:9px;letter-spacing:.5px}
.price{margin:0;color:#42ff8b;font-family:'Orbitron';font-size:18px;font-weight:700}
.stock{margin-top:5px;color:#77877f;font-size:10px}
.product-actions{display:flex;justify-content:flex-end;gap:9px;margin:0}
.product-actions a{
  flex:0 0 auto;min-width:105px;padding:11px 10px;text-align:center;text-decoration:none;
  font-family:'Orbitron';font-size:8px;letter-spacing:.7px
}
.buy{background:#42ff8b;color:#001006}
.details{color:#dffff0;border:1px solid rgba(61,255,136,.45)}
.details:hover{background:rgba(61,255,136,.12)}
.empty-products{
  padding:35px 20px;color:#77877f;text-align:center;font-family:'Orbitron';font-size:10px;letter-spacing:1px
}
.loading-products{
  padding:25px;color:#42ff8b;font-family:'Orbitron';font-size:11px;letter-spacing:1px
}
footer{
  border-top:1px solid rgba(61,255,136,.18);padding:28px 5%;display:flex;
  justify-content:space-between;align-items:center;color:#536158;font-size:11px
}
footer span{color:#42ff8b;font-family:'Orbitron'}

@media(max-width:1100px){
  .category-grid,.network-grid{grid-template-columns:repeat(2,1fr)}
  .product{grid-template-columns:minmax(220px,2fr) 120px 100px 210px}
}
@media(max-width:650px){
  .category-grid,.network-grid{grid-template-columns:1fr}
  .product{grid-template-columns:1fr;gap:12px;padding:16px}
  .product-media{align-items:flex-start}
  .product-thumb,.product-card{width:125px;height:72px;flex-basis:125px}
  .product-actions{justify-content:flex-start}
  .product-actions a,.product-actions button{min-width:105px}
  .navbar{padding:0 18px}
  .logo-name{font-size:16px}
  .nav-btn{display:none}
  .balance{font-size:8px;padding:9px 10px}
  .cart-btn{font-size:8px;padding:9px 8px}
  .container{width:92%;padding-top:45px}
  .products-toolbar{align-items:flex-start;gap:12px}
  footer{flex-direction:column;gap:12px}
}
</style>
</head>

<body>
<div class="aura"></div>

<header class="navbar">
  <div class="logo">
    <div class="logo-mark">N</div>
    <div>
      <div class="logo-name">NEXVORA</div>
      <div class="logo-sub">DIGITAL STORE</div>
    </div>
  </div>
  <div class="nav-actions">
    <a href="home.html" class="nav-btn">⌂ HOME</a>
    <div class="balance">◉ BALANCE: ₹0</div>
    <a href="cart.html" class="cart-btn">🛒 CART <span class="cart-count" id="cartCount">0</span></a>
    <a href="dashboard.html" class="nav-btn">◉ DASHBOARD</a>
  </div>
</header>

<main class="container">
  <div class="system"><span class="system-dot"></span>NEXVORA STORE ONLINE</div>

  <h1>DIGITAL <span>STORE</span></h1>
  <p class="subtitle">SELECT A CATEGORY TO CONTINUE</p>

  <section class="category-panel" id="categoryPanel">
    <div class="section-label">AVAILABLE CATEGORIES</div>
    <div class="category-grid">
      <button class="category-btn" data-category="DIGITAL PRODUCTS">
        DIGITAL PRODUCTS
        <small>Digital items & resources</small>
      </button>
      <button class="category-btn" data-category="GIFT CARD">
        GIFT CARD
        <small>Gift card products</small>
      </button>
      <button class="category-btn" data-category="GOOGLE PLAY STORE CODE">
        GOOGLE PLAY STORE CODE
        <small>Redeem code products</small>
      </button>
      <button class="category-btn" data-category="TOPUP">
        TOPUP
        <small>Game top-up products</small>
      </button>
    </div>
  </section>


  <section class="network-panel" id="networkPanel">
    <div class="section-label">SELECT CARD NETWORK</div>
    <div class="network-grid">
      <button class="network-btn" data-network="RUPAY">RUPAY<small>RuPay products</small></button>
      <button class="network-btn" data-network="VISA">VISA<small>Visa products</small></button>
      <button class="network-btn" data-network="MASTERCARD">MASTERCARD<small>Mastercard products</small></button>
      <button class="network-btn" data-network="AMEX">AMEX<small>American Express products</small></button>
    </div>
  </section>

  <section class="products-section" id="productsSection">
    <div class="products-toolbar">
      <div class="current-category" id="currentCategory">CATEGORY</div>
      <button class="back-categories" id="backCategories">← CATEGORIES</button>
    </div>

    <div class="product-grid" id="productGrid">
      <div class="loading-products">LOADING PRODUCTS...</div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<footer>
  <div>NEXVORA DIGITAL STORE</div>
  <span>● SYSTEM ONLINE</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

const SUPABASE_URL='https://lkspavoccfcwgufmczzq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Dcahy9-eTRD5qe_5wz1z8A_hhQEn_1T';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const productGrid=document.getElementById('productGrid');
const balanceBox=document.querySelector('.balance');
const productsSection=document.getElementById('productsSection');
const currentCategory=document.getElementById('currentCategory');
const categoryButtons=[...document.querySelectorAll('.category-btn')];
const networkPanel=document.getElementById('networkPanel');
const networkButtons=[...document.querySelectorAll('.network-btn')];
const cartCount=document.getElementById('cartCount');
const toast=document.getElementById('toast');

let allProducts=[];
let selectedCategory='';

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function formatPrice(value){
  return Number(value || 0).toLocaleString('en-IN',{
    minimumFractionDigits:2,maximumFractionDigits:2
  });
}

function normalize(value){
  return String(value ?? '').trim().toUpperCase();
}

function getCart(){
  try{
    const cart=JSON.parse(localStorage.getItem('nexvora_cart') || '[]');
    return Array.isArray(cart) ? cart : [];
  }catch(e){ return []; }
}

function saveCart(cart){
  localStorage.setItem('nexvora_cart',JSON.stringify(cart));
}

function updateCartCount(){
  const cart=getCart();
  const count=cart.reduce((total,item)=>total+Math.max(1,Number(item.quantity)||1),0);
  cartCount.textContent=count;
}

function showToast(message){
  toast.textContent=message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>toast.classList.remove('show'),2200);
}

function addToCart(product,button){
  const cart=getCart();
  const id=String(product.id);
  const existing=cart.find(item=>String(item.id)===id);

  if(existing){
    existing.quantity=Math.max(1,Number(existing.quantity)||1)+1;
  }else{
    cart.push({
      id:product.id,
      name:product.name || 'UNNAMED PRODUCT',
      price:Number(product.price)||0,
      image_url:product.image_url || '',
      quantity:1
    });
  }

  saveCart(cart);
  updateCartCount();

  if(button){
    const oldText=button.textContent;
    button.textContent='ADDED ✓';
    button.classList.add('added');
    setTimeout(()=>{
      button.textContent=oldText;
      button.classList.remove('added');
    },1200);
  }
  showToast(existing ? 'PRODUCT QUANTITY UPDATED IN CART' : 'PRODUCT ADDED TO CART');
}

function productCard(product){
  const category=product.category || 'DIGITAL PRODUCTS';
  const brand=product.brand || 'NEXVORA';
  const custom=(product.custom_fields && typeof product.custom_fields==='object' && !Array.isArray(product.custom_fields)) ? product.custom_fields : {};
  const quantity=custom.quantity ?? '—';
  const cat=normalize(category);
  let infoLine='';
  if(cat==='DIGITAL PRODUCTS') infoLine=[custom.card_network,custom.card_type].filter(Boolean).join(' • ') || 'Digital product';
  else if(cat==='GIFT CARD') infoLine=[custom.brand,custom.denomination,custom.region].filter(Boolean).join(' • ') || 'Gift card';
  else if(cat==='GOOGLE PLAY STORE CODE') infoLine=[custom.denomination,custom.region].filter(Boolean).join(' • ') || 'Redeem code';
  else if(cat==='TOPUP') infoLine=[custom.game,custom.topup_unit,custom.package].filter(Boolean).join(' • ') || 'Game top-up';

  const image=product.image_url
    ? `<img class="product-thumb" src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name || 'Product')}">`
    : `<div class="product-card">
        <div class="card-brand">${escapeHtml(cat==='TOPUP'?(custom.game||'TOPUP'):brand)}</div>
        <div class="chip"></div>
        <div class="card-number">${escapeHtml(cat==='DIGITAL PRODUCTS' ? (custom.card_number || 'DIGITAL PRODUCT') : category)}</div>
        <div class="card-type"><span>${escapeHtml(category)}</span><strong>NEXVORA</strong></div>
      </div>`;

  return `<article class="product">
    <div class="product-media">${image}<div class="product-info">
      <div class="product-category">${escapeHtml(category)}</div>
      <h2>${escapeHtml(product.name || 'UNNAMED PRODUCT')}</h2>
      <p class="product-desc">${escapeHtml(infoLine)}</p>
      <p class="product-desc">${escapeHtml(product.description || '')}</p>
    </div></div>
    <div class="product-meta"><div class="price">₹${formatPrice(product.price)}</div></div>
    <div class="product-meta"><div class="stock">STOCK: ${escapeHtml(quantity)}</div></div>
    <div class="product-actions">
      <a href="product.html?id=${encodeURIComponent(product.id)}" class="details">SEE DETAILS</a>
      <button type="button" class="add-cart" data-product-id="${escapeHtml(product.id)}">ADD TO CART</button>
      <a href="product.html?id=${encodeURIComponent(product.id)}" class="buy">BUY NOW</a>
    </div>
  </article>`;
}

function renderCategoryProducts(category){
  const filtered=allProducts.filter(p=>normalize(p.category)===normalize(category));
  currentCategory.textContent=category;
  productsSection.classList.add('visible');
  productGrid.innerHTML=filtered.length ? filtered.map(productCard).join('') : '<div class="empty-products">NO ACTIVE PRODUCTS IN THIS CATEGORY.</div>';
  productsSection.scrollIntoView({behavior:'smooth',block:'start'});
}

function showCategory(category){
  selectedCategory=category;
  categoryButtons.forEach(btn=>btn.classList.toggle('active',normalize(btn.dataset.category)===normalize(category)));
  networkButtons.forEach(btn=>btn.classList.remove('active'));
  if(normalize(category)==='DIGITAL PRODUCTS'){
    currentCategory.textContent=category+' / SELECT NETWORK';
    networkPanel.classList.add('visible');
    productsSection.classList.remove('visible');
    networkPanel.scrollIntoView({behavior:'smooth',block:'start'});
  }else{
    networkPanel.classList.remove('visible');
    renderCategoryProducts(category);
  }
}

function showNetwork(network){
  networkButtons.forEach(btn=>{
    btn.classList.toggle('active',normalize(btn.dataset.network)===normalize(network));
  });

  currentCategory.textContent=selectedCategory+' / '+network;
  productsSection.classList.add('visible');

  const wantedCategory=normalize(selectedCategory);
  const wantedNetwork=normalize(network);

  const filtered=allProducts.filter(p=>{
    const custom=(p.custom_fields && typeof p.custom_fields==='object' && !Array.isArray(p.custom_fields))
      ? p.custom_fields : {};
    return normalize(p.category)===wantedCategory &&
           normalize(custom.card_network)===wantedNetwork;
  });

  if(!filtered.length){
    productGrid.innerHTML='<div class="empty-products">NO ACTIVE PRODUCTS FOR THIS NETWORK.</div>';
    productsSection.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }

  productGrid.innerHTML=filtered.map(productCard).join('');
  productsSection.scrollIntoView({behavior:'smooth',block:'start'});
}

async function loadProducts(){
  productGrid.innerHTML='<div class="loading-products">LOADING PRODUCTS...</div>';

  const result=await db.from('products')
    .select('id,name,description,price,image_url,category,brand,is_active,custom_fields')
    .eq('is_active',true)
    .order('created_at',{ascending:false});

  if(result.error){
    productGrid.innerHTML=`<div class="empty-products">${escapeHtml(result.error.message)}</div>`;
    return;
  }

  allProducts=result.data || [];
}

async function loadBalance(){
  const sessionResult=await db.auth.getSession();
  const session=sessionResult.data.session;

  if(!session){
    balanceBox.textContent='BALANCE: ₹0.00';
    return;
  }

  const result=await db.from('profiles')
    .select('balance')
    .eq('user_id',session.user.id)
    .maybeSingle();

  if(result.error || !result.data){
    balanceBox.textContent='BALANCE: ₹0.00';
    return;
  }

  balanceBox.textContent=`BALANCE: ₹${formatPrice(result.data.balance)}`;
}

categoryButtons.forEach(btn=>{
  btn.addEventListener('click',()=>showCategory(btn.dataset.category));
});

networkButtons.forEach(btn=>{
  btn.addEventListener('click',()=>showNetwork(btn.dataset.network));
});

productGrid.addEventListener('click',(event)=>{
  const button=event.target.closest('.add-cart');
  if(!button) return;
  const product=allProducts.find(item=>String(item.id)===String(button.dataset.productId));
  if(product) addToCart(product,button);
});

document.getElementById('backCategories').addEventListener('click',()=>{
  productsSection.classList.remove('visible');
  networkPanel.classList.remove('visible');
  categoryButtons.forEach(btn=>btn.classList.remove('active'));
  networkButtons.forEach(btn=>btn.classList.remove('active'));
  selectedCategory='';
  currentCategory.textContent='CATEGORY';
  document.getElementById('categoryPanel').scrollIntoView({behavior:'smooth',block:'start'});
});

async function refreshStore(){
  updateCartCount();
  await Promise.all([loadProducts(),loadBalance()]);
}

refreshStore();

db.auth.onAuthStateChange(()=>loadBalance());

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){ updateCartCount(); loadBalance(); }
});

window.addEventListener('focus',()=>{ updateCartCount(); loadBalance(); });
window.addEventListener('storage',updateCartCount);
</script>
</body>
</html>
